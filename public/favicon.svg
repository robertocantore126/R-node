<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tileBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3847"/>
      <stop offset="100%" stop-color="#2c2a36"/>
    </linearGradient>
    <linearGradient id="legGrad" x1="246" y1="270" x2="360" y2="382" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c78e0"/>
      <stop offset="100%" stop-color="#6965c7"/>
    </linearGradient>
  </defs>

  <!-- Matte slate squircle tile with subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tileBg)" stroke="#525060" stroke-width="18"/>

  <!-- Diagonal periwinkle-indigo branching leg (behind center junction node) -->
  <line x1="246" y1="270" x2="360" y2="382" stroke="url(#legGrad)" stroke-width="36" stroke-linecap="round"/>

  <!-- White architectural R structure -->
  <path d="M 152 130 L 152 382 M 152 130 L 282 130 A 70 70 0 0 1 282 270 L 152 270"
        fill="none" stroke="#f3f3f6" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top-left node -->
  <circle cx="152" cy="130" r="35" fill="#f3f3f6"/>
  <circle cx="152" cy="130" r="16" fill="#33313d"/>

  <!-- Bottom-left node -->
  <circle cx="152" cy="382" r="35" fill="#f3f3f6"/>
  <circle cx="152" cy="382" r="16" fill="#33313d"/>

  <!-- Center junction node -->
  <circle cx="246" cy="270" r="35" fill="#f3f3f6"/>
  <circle cx="246" cy="270" r="16" fill="#33313d"/>

  <!-- Outer branching node with warm gold accent ring -->
  <circle cx="360" cy="382" r="35" fill="#6f6bd1"/>
  <circle cx="360" cy="382" r="19" fill="#e0b82e"/>
  <circle cx="360" cy="382" r="10" fill="#33313d"/>
</svg>
